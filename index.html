<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Tiny Woo</title>
<link rel="icon" href="assets/logo/tinywoo-logo.png">
<link rel="stylesheet" href="styles.css">
<style>:root{color-scheme:dark;--player-top:96px}@media (max-width:760px){:root{--player-top:72px}}html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body);overflow-x:hidden}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="js/tinywoo-ds.js"></script>
<script>document.write('<script src="inhalt.js?v=' + Date.now() + '"><\/script>');</script>
<script type="module">import * as m from './game/daiganoid.js'; window.Daiganoid = m;</script>
</head><body><div id="root"></div>
<script type="text/babel" src="js/site-hero.jsx"></script>
<script type="text/babel" src="js/site-daiganoid.jsx"></script>
<script type="text/babel" src="js/site-arcade.jsx"></script>
<script type="text/babel" src="js/site-sections.jsx"></script>
<script type="text/babel">
const { NavBar, MusicPlayer } = window.TinyWooDesignSystem_fe221f;
const I = window.TW_INHALT;
const LINKS = [{ id: 'home', label: 'Home' }, { id: 'games', label: 'Games' }, { id: 'arcade', label: 'Arcade' }, { id: 'about', label: 'About' }, { id: 'press', label: 'Press' }];
const CAN_OGG = !!document.createElement('audio').canPlayType('audio/ogg; codecs="vorbis"');
function App() {
  const [page, setPage] = React.useState(() => (location.hash.slice(1) || 'home'));
  React.useEffect(() => { const h = () => setPage(location.hash.slice(1) || 'home'); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  const nav = p => { location.hash = p === 'home' ? '' : p; setPage(p); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  return (
    <div style={{ minHeight: '100vh' }}>
      <NavBar logo={I.logo} links={LINKS} active={page} onNavigate={nav} />
      {page === 'home' && <>
        <Hero onNav={nav} />
        <Ticker items={I.texte.laufband} />
        <div style={{ height: 40 }} />
        <FeaturedGame onNav={nav} />
        <ArcadeTeaser onNav={nav} />
        <Community />
      </>}
      {page === 'games' && <GamesPage onNav={nav} />}
      {page === 'arcade' && <ArcadePage />}
      {page === 'about' && <AboutPage />}
      {page === 'press' && <PressPage />}
      <Footer onNav={nav} />
      {CAN_OGG && <div style={{ position: 'fixed', inset: 'var(--player-top) 16px 14px', zIndex: 30, pointerEvents: 'none' }}>
        <MusicPlayer tracks={I.musik} storageKey="tw-site-player" style={{ pointerEvents: 'none' }} />
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
