<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Tiny Woo</title>
<link rel="icon" href="assets/logo/tinywoo-logo.png">
<!-- Cache-Busting: version.js wird immer frisch geholt (Date.now), alle eigenen Dateien bekommen ?v=TW_V.
     TW_V + Modulliste schreibt tools/version.sh automatisch bei jedem Commit (git pre-commit Hook). -->
<script>document.write('<script src="version.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(function () {
  window.TW_V = window.TW_V || Date.now();
  var v = '?v=' + window.TW_V, w = function (s) { document.write(s); };
  ['fonts', 'colors', 'typography', 'spacing', 'effects', 'base'].forEach(function (n) { w('<link rel="stylesheet" href="tokens/' + n + '.css' + v + '">'); });
  var map = {}; (window.TW_GAME || []).forEach(function (f) { map['./' + f] = './' + f + v; });
  w('<script type="importmap">' + JSON.stringify({ imports: map }) + '<\/script>');
})();
</script>
<style>:root{color-scheme:dark;--player-top:96px}@media (max-width:760px){:root{--player-top:72px}}html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body);overflow-x:hidden}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>document.write('<script src="js/tinywoo-ds.js?v=' + TW_V + '"><\/script>');</script>
<script>document.write('<script src="inhalt.js?v=' + Date.now() + '"><\/script>');</script>
<script type="module">import * as m from './game/daiganoid.js'; window.Daiganoid = m;</script>
</head><body><div id="root"></div>
<script>['site-hero', 'site-daiganoid', 'site-arcade', 'site-sections'].forEach(function (n) { document.write('<script type="text/babel" src="js/' + n + '.jsx?v=' + TW_V + '"><\/script>'); });</script>
<script type="text/babel">
const { NavBar, MusicPlayer } = window.TinyWooDesignSystem_fe221f;
const I = window.TW_INHALT;
const LINKS = [{ id: 'home', label: 'Home' }, { id: 'games', label: 'Games' }, { id: 'arcade', label: 'Arcade' }, { id: 'about', label: 'About' }, { id: 'press', label: 'Press' }];
const CAN_OGG = !!document.createElement('audio').canPlayType('audio/ogg; codecs="vorbis"');
// Site-Player: lebt in einem eigenen Wirt-Div (Portal), das nie neu gebaut wird, damit die Musik weiterlaeuft.
// Frei: fixe Ebene ueber der Seite. Arcade: der Wirt wandert in den Andock-Platz ueber dem Spielfeld und scrollt mit.
const PLAYER_FREE = 'position:fixed;inset:var(--player-top) 16px 14px;z-index:30;pointer-events:none';
const PLAYER_DOCKED = 'position:absolute;inset:0;pointer-events:none';
function App() {
  const [page, setPage] = React.useState(() => (location.hash.slice(1) || 'home'));
  const [host] = React.useState(() => { const d = document.createElement('div'); d.style.cssText = PLAYER_FREE; document.body.appendChild(d); return d; });
  const [dockEl, setDockEl] = React.useState(null);
  const flipFrom = React.useRef(null);
  const cardRect = () => { const c = host.firstElementChild && host.firstElementChild.firstElementChild; const r = c && c.getBoundingClientRect(); return r && r.width ? r : null; };
  const onDock = React.useCallback((el) => { flipFrom.current = cardRect(); setDockEl(el); }, []);
  React.useLayoutEffect(() => {
    if (dockEl) { host.style.cssText = PLAYER_DOCKED; dockEl.appendChild(host); }
    else { host.style.cssText = PLAYER_FREE; document.body.appendChild(host); }
    const a = flipFrom.current, b = cardRect();
    flipFrom.current = null;
    if (!a || !b || !host.animate) return;
    const dx = a.right - b.right, dy = a.top - b.top;
    if (Math.abs(dx) + Math.abs(dy) < 2) return;
    // Weich losfliegen, kurz ueberschiessen, einrasten
    host.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(.94)`, easing: 'cubic-bezier(.6,0,.2,1)' },
      { transform: 'translate(0, 0) scale(1.06)', offset: 0.8, easing: 'cubic-bezier(.3,0,.3,1)' },
      { transform: 'none' },
    ], { duration: 560 });
  }, [dockEl]);
  React.useEffect(() => { const h = () => setPage(location.hash.slice(1) || 'home'); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  const nav = p => { location.hash = p === 'home' ? '' : p; setPage(p); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  return (
    <div style={{ minHeight: '100vh' }}>
      <NavBar logo={I.logoNav} links={LINKS} active={page} onNavigate={nav} overlay={page === 'home'} />
      {page === 'home' && <>
        <Hero onNav={nav} />
        <Ticker items={I.texte.laufband} />
        <FeaturedGame onNav={nav} />
        <ArcadeTeaser onNav={nav} />
        <Community />
      </>}
      {page === 'games' && <GamesPage onNav={nav} />}
      {page === 'arcade' && <ArcadePage onDock={CAN_OGG ? onDock : undefined} />}
      {page === 'about' && <AboutPage />}
      {page === 'press' && <PressPage />}
      <Footer onNav={nav} />
      {CAN_OGG && ReactDOM.createPortal(<MusicPlayer tracks={I.musik} storageKey="tw-site-player" docked={!!dockEl} style={{ pointerEvents: 'none' }} />, host)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
